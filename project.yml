# The Xcode project is generated from this file; LowTalker.xcodeproj is gitignored.
# [LAW:one-source-of-truth] Every build setting the app needs lives here, including
# the Info.plist keys, so there is no second file to hand-edit or review.
name: LowTalker

options:
  deploymentTarget:
    macOS: "15.0"

# Shared by every target. macOS keys Microphone, Accessibility, and Input Monitoring
# grants to the signing certificate, so dev builds carry a self-signed identity that
# `make signing-identity` creates once per Mac. Ad hoc signing would key the grants to
# each build's own hash and lose them on every rebuild. The keyboard helper admits
# exactly the certificate that signed it, which is one more reason the app and the
# helper are signed by the one identity named here; scripts/signing-identity reads it
# for the CLI and helper builds outside Xcode.
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: LowTalker Dev

packages:
  # [LAW:one-way-deps] The app links the SwiftPM package at the repo root; the
  # package knows nothing of the app.
  low-talker:
    path: .

# [LAW:one-type-per-behavior] The two installations are not two apps. They are one app
# built twice, and what separates them is three strings: the identity macOS keys the TCC
# grants and Login Items record to, the name a person reads in the menu bar, and which
# launchd plist rides in the bundle. So there is one template and two sets of attributes
# rather than two targets that must be kept in step by hand.
#
# The strings themselves belong to `Flavor` in Sources/Flavors; xcodegen cannot read
# Swift, so they are written again here, and `ProjectFlavorTests` is what holds these
# copies to that one. [LAW:one-source-of-truth]
targetTemplates:
  Installation:
    type: application
    platform: macOS
    sources:
      - App/LowTalker
      # The keyboard helper's launchd plist, where SMAppService.daemon reads it from.
      # One per installation, named for the job it registers.
      - path: App/LaunchDaemons/${launchdLabel}.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: low-talker
        product: LowTalkerCore
      - package: low-talker
        product: KeyboardService
      # The list of what must hold before low-talker can type, which the menu shows and
      # `lowtalker onboard` prints. One list, two views. [LAW:one-source-of-truth]
      - package: low-talker
        product: Onboarding
      - package: low-talker
        product: Signals
      - package: low-talker
        product: Typing
      - package: low-talker
        product: Dictation
      # The helper rides inside the bundle, where the plist above names it, signed on
      # copy with the app's own identity. One tool target embedded in both bundles: the
      # binary is the same program either way, and which installation it serves is the
      # `--flavor` its plist passes, never a second build of it.
      - target: lowtalker-keyboardd
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/MacOS
    settings:
      base:
        PRODUCT_NAME: ${displayName}
        PRODUCT_BUNDLE_IDENTIFIER: ${bundleIdentifier}
        # No checked-in Info.plist: Xcode synthesises one from these keys.
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: low-talker listens to your microphone while you hold the dictation key so it can turn what you say into text. Audio never leaves this Mac.

targets:
  LowTalker:
    templates: [Installation]
    templateAttributes:
      displayName: LowTalker
      bundleIdentifier: ltd.deadgrass.low-talker
      launchdLabel: com.lowtalker.keyboardd

  # The copy built from the working tree, installed and running beside the one above.
  LowTalkerDev:
    templates: [Installation]
    templateAttributes:
      displayName: LowTalker Dev
      bundleIdentifier: ltd.deadgrass.low-talker.dev
      launchdLabel: com.lowtalker.keyboardd.dev

  # The root keyboard helper, built here from the same sources Package.swift builds it
  # from, because an Xcode app can embed an Xcode tool and cannot embed a package's
  # executable. `make helper` builds the same program for the LaunchDaemon path.
  lowtalker-keyboardd:
    type: tool
    platform: macOS
    sources:
      - Sources/lowtalker-keyboardd
    dependencies:
      - package: low-talker
        product: KeyboardService
      - package: low-talker
        product: VirtualKeyboard
      - package: low-talker
        product: Keystrokes
      - package: low-talker
        product: Signals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lowtalker.keyboardd
