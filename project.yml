# The Xcode project is generated from this file; LowTalker.xcodeproj is gitignored.
# [LAW:one-source-of-truth] Every build setting the app needs lives here, including
# the Info.plist keys, so there is no second file to hand-edit or review.
name: LowTalker

options:
  deploymentTarget:
    macOS: "15.0"

# Shared by every target. macOS keys Microphone, Accessibility, and Input Monitoring
# grants to the signing certificate, so dev builds carry a self-signed identity that
# `make signing-identity` creates once per Mac. Ad hoc signing would key the grants to
# each build's own hash and lose them on every rebuild. The keyboard helper admits
# exactly the certificate that signed it, which is one more reason the app and the
# helper are signed by the one identity named here; scripts/signing-identity reads it
# for the CLI and helper builds outside Xcode.
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: LowTalker Dev
    # Notarization refuses a binary without it, and every target in this file is one a
    # release carries: the app and the helper embedded in it.
    ENABLE_HARDENED_RUNTIME: YES
  # A build to hand to someone else: the Developer ID certificate, which Gatekeeper trusts
  # and notarization accepts, in place of the dev identity nobody trusts. The helper admits
  # exactly the certificate that signed it, so the app and the helper embedded in it change
  # certificate together; a CLI signed with the dev identity is refused by this build's
  # helper, as it should be. scripts/sign-release builds this configuration.
  #
  # Notarization refuses two things Xcode signs in by default, in Release as in Debug:
  # the get-task-allow entitlement, which CODE_SIGN_INJECT_BASE_ENTITLEMENTS adds, and a
  # signature with no secure timestamp, since Xcode passes --timestamp=none unless told.
  configs:
    Release:
      CODE_SIGN_IDENTITY: Developer ID Application
      DEVELOPMENT_TEAM: 6R988MUU27
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: --timestamp

packages:
  # [LAW:one-way-deps] The app links the SwiftPM package at the repo root; the
  # package knows nothing of the app.
  low-talker:
    path: .

# [LAW:one-type-per-behavior] The two installations are not two apps. They are one app
# built twice, and what separates them is three strings: the identity macOS keys the TCC
# grants and Login Items record to, the name a person reads in the menu bar, and which
# launchd plist rides in the bundle. So there is one template and two sets of attributes
# rather than two targets that must be kept in step by hand.
#
# The strings themselves belong to `Flavor` in Sources/Flavors; xcodegen cannot read
# Swift, so they are written again here, and `ProjectFlavorTests` is what holds these
# copies to that one. [LAW:one-source-of-truth]
targetTemplates:
  Installation:
    type: application
    platform: macOS
    sources:
      - App/LowTalker
      # The keyboard helper's launchd plist, where SMAppService.daemon reads it from.
      # One per installation, named for the job it registers.
      - path: App/LaunchDaemons/${launchdLabel}.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: low-talker
        product: LowTalkerCore
      - package: low-talker
        product: KeyboardService
      # The list of what must hold before low-talker can type, which the menu shows and
      # `lowtalker onboard` prints. One list, two views. [LAW:one-source-of-truth]
      - package: low-talker
        product: Onboarding
      - package: low-talker
        product: Signals
      - package: low-talker
        product: Typing
      # The layout names the clipboard hotkey's key as the user's keyboard prints it.
      - package: low-talker
        product: KeyboardLayout
      - package: low-talker
        product: Dictation
      # The helper rides inside the bundle, where the plist above names it, signed on
      # copy with the app's own identity. One tool target embedded in both bundles: the
      # binary is the same program either way, and which installation it serves is the
      # `--flavor` its plist passes, never a second build of it.
      - target: lowtalker-keyboardd
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/MacOS
      # The input method bundle, carried the way the helper is so a copy of the app has
      # everything it delivers with. Unlike the helper, it is a bundle of its own with its
      # own identifier, so there is one target per flavor rather than one tool embedded
      # twice: macOS keys a registered input source by that identifier.
      - target: ${inputMethodTarget}
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/InputMethods
    # Every entitlement here is named with the failure that required it, read off a
    # Hardened Runtime build rather than guessed; one nobody can name is removed.
    # xcodegen writes the plist from these properties on every generate, so the file
    # it writes is build output, ignored like the project beside it.
    #
    # com.apple.security.device.audio-input: with the runtime on and this absent, tccd
    # logs "Prompting policy for hardened runtime; service: kTCCServiceMicrophone
    # requires entitlement com.apple.security.device.audio-input but it is missing".
    # A Mac that already granted the microphone keeps hearing; a Mac that has not is
    # never asked, and the app is deaf.
    #
    # Measured with nothing else in the file, on both installations: the session event
    # tap, Accessibility, the paste, SMAppService and the XPC connection to the helper
    # all work, and the helper, hardened too, needs no entitlements of its own.
    entitlements:
      path: App/Generated/LowTalker.entitlements
      properties:
        com.apple.security.device.audio-input: true
    # A release carries what a first run would otherwise fetch: a store holding its model,
    # so a first launch installs it with the network off, and the pinned virtual keyboard
    # driver package, so installing the driver needs no GitHub. Copied in after every other
    # phase, so the signature Xcode writes last seals them with the rest of the bundle.
    # `make` passes BUNDLED_MODEL_STORE and BUNDLED_DRIVER_PACKAGE, which only
    # scripts/sign-release sets; a build that names neither carries neither.
    postBuildScripts:
      - name: Carry what a first run would fetch
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          # Removed on every build, named or not: Xcode leaves a file it did not make in
          # the bundle, so what an earlier build carried would ride along, and ditto
          # merges into a folder already there.
          rm -rf "${resources}/${MODEL_STORE_RESOURCE}" "${resources}/${DRIVER_PACKAGE_RESOURCE}"
          # An empty setting reaches the script unset, not empty.
          if [ -n "${BUNDLED_MODEL_STORE:-}" ]; then
            ditto "${BUNDLED_MODEL_STORE}" "${resources}/${MODEL_STORE_RESOURCE}"
          fi
          if [ -n "${BUNDLED_DRIVER_PACKAGE:-}" ]; then
            ditto "${BUNDLED_DRIVER_PACKAGE}" "${resources}/${DRIVER_PACKAGE_RESOURCE}"
          fi
    # The Insert Dictation service: the app that asks gets the latest dictation's words and
    # puts them at its cursor, so no key is posted and no grant is needed. It returns text
    # and takes none, so it is offered at a bare cursor. NSRequiredContext, even empty,
    # enables it without a trip to Keyboard Shortcuts. The shortcut is per installation, so
    # the two copies do not answer one key: serviceKey "@" is Command+Shift+2 on a US layout
    # for the release copy, "!" Command+Shift+1 for the development one. NSTimeout is how long the
    # requesting app waits for a reply, in milliseconds; the handler reads the last dictation and returns
    # at once, so it is only a ceiling and is never reached. xcodegen writes this plist, and Xcode merges it with
    # the keys GENERATE_INFOPLIST_FILE synthesises.
    info:
      path: App/Generated/${displayName}-Info.plist
      properties:
        NSServices:
          - NSMenuItem:
              default: Insert ${displayName} Dictation
            NSMessage: insertDictation
            NSPortName: ${displayName}
            NSReturnTypes: [public.utf8-plain-text]
            NSKeyEquivalent:
              default: "${serviceKey}"
            NSRequiredContext: {}
            NSTimeout: "30000"
    settings:
      base:
        PRODUCT_NAME: ${displayName}
        PRODUCT_BUNDLE_IDENTIFIER: ${bundleIdentifier}
        # No checked-in Info.plist: Xcode synthesises one from these keys.
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: low-talker listens to your microphone while you hold the dictation key so it can turn what you say into text. Audio never leaves this Mac.
        # Where the bundle's resources hold the carried store, as ModelStore.carriedResourceName
        # names it; CarriedModelStoreTests holds the two equal. [LAW:one-source-of-truth]
        MODEL_STORE_RESOURCE: model-store
        # Named without its version, so whatever installs it from the bundle need not change
        # when the pin does; scripts/virtual-hid-driver checks the bytes against the pin.
        DRIVER_PACKAGE_RESOURCE: Karabiner-DriverKit-VirtualHIDDevice.pkg

  # [LAW:one-type-per-behavior] One input method, built once per installation. What
  # separates the two copies is what separates the apps - the names macOS files them under
  # - so this is one template with two sets of attributes, and every name in it is
  # `Flavor`'s.
  #
  # The `.inputmethod` segment in the identifier is not decoration and its position is not
  # free: measured on macOS Tahoe, a bundle whose identifier ENDS in `.inputmethod`, or
  # carries no such segment, registers nothing at all, while `…inputmethod.dictation` is
  # taken - and `TISRegisterInputSource` answers noErr either way. `Flavor` is where that
  # rule is written down; this file only spends the names it decides.
  InputMethod:
    type: application
    platform: macOS
    sources:
      - Sources/lowtalker-inputmethod
      # The glyph the Input menu shows beside the name. A template image, so macOS tints
      # it to match the menu bar rather than the bundle carrying a light and a dark copy.
      # One icon for both flavors: what tells the two copies apart in that menu is the
      # name beside it, which is `Flavor.displayName`.
      - App/InputMethods/InputMethod.tiff
    dependencies:
      - package: low-talker
        product: InputMethod
      - package: low-talker
        product: Flavors
    # macOS resolves `InputMethodServerControllerClass` through the Objective-C runtime at
    # launch, so this string and the class's `@objc` name are one fact in two places;
    # `InputMethodPlistTests` holds them equal.
    info:
      path: App/Generated/${displayName}-InputMethod-Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSSupportsSuddenTermination: true
        InputMethodConnectionName: ${inputMethodConnectionName}
        InputMethodServerControllerClass: DictationInputController
        TISIntendedLanguage: en
        TISIconIsTemplate: true
        tsInputMethodIconFileKey: InputMethod.tiff
        ComponentInputModeDict:
          tsInputModeListKey:
            ${inputSourceIdentifier}:
              TISInputSourceID: ${inputSourceIdentifier}
              tsInputModeDefaultStateKey: true
              tsInputModeIsVisibleKey: true
              tsInputModeMenuIconFileKey: InputMethod.tiff
              tsInputModePrimaryInScriptKey: true
              tsInputModeScriptKey: smUnicodeScript
          # Mode keys, not source identifiers - the two are the same string here, and a
          # wrong one is a source that silently never appears in the Input menu.
          # [LAW:no-silent-failure]
          tsVisibleInputModeOrderedArrayKey:
            - ${inputSourceIdentifier}
    settings:
      base:
        # The bundle and the process are named for what they are, so a person reading
        # Activity Monitor or a log line can tell this apart from the app carrying it.
        # `CFBundleName` follows PRODUCT_NAME - Xcode synthesises it and its value beats
        # anything the plist file says, measured - and that is left alone: what a person
        # reads in the Input Sources list is the LOCALIZED name, which the script below
        # writes from `Flavor.displayName`, and which macOS prefers over this.
        PRODUCT_NAME: ${displayName} Input Method
        PRODUCT_BUNDLE_IDENTIFIER: ${inputMethodBundleIdentifier}
        GENERATE_INFOPLIST_FILE: true
        # Read by the script below, which is the only way this bundle's one localized
        # string can be written from the same names the plist above uses.
        INPUT_SOURCE_ID: ${inputSourceIdentifier}
        INPUT_METHOD_NAME: ${displayName}
    # The name a person reads in the Input Sources list and the Input menu. macOS takes it
    # from the bundle's localized strings, keyed by the source identifier, and NOT from
    # `CFBundleName` alone: measured, a bundle without this file shows the raw identifier
    # for the mode. Written here rather than checked in so no input method name is spelled
    # anywhere but `Flavor` and this file. [LAW:one-source-of-truth]
    postBuildScripts:
      - name: The name the Input Sources list shows
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          strings="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/en.lproj/InfoPlist.strings"
          mkdir -p "$(dirname "${strings}")"
          printf '"CFBundleName" = "%s";\n"%s" = "%s";\n' \
            "${INPUT_METHOD_NAME}" "${INPUT_SOURCE_ID}" "${INPUT_METHOD_NAME}" > "${strings}"

targets:
  # Every name below is `Flavor`'s, written again because xcodegen cannot read Swift, and
  # `ProjectFlavorTests` is what holds these copies to it. The input method's names sit on
  # its own target rather than on the app's: the app needs only the name of the target it
  # carries, and a name written in both places is one that can come to disagree.
  # [LAW:one-source-of-truth]
  LowTalker:
    templates: [Installation]
    templateAttributes:
      displayName: LowTalker
      bundleIdentifier: ai.promptctl.low-talker
      serviceKey: "@"
      launchdLabel: ai.promptctl.low-talker.keyboardd
      inputMethodTarget: LowTalkerInputMethod

  # The copy built from the working tree, installed and running beside the one above.
  LowTalkerDev:
    templates: [Installation]
    templateAttributes:
      displayName: LowTalker Dev
      bundleIdentifier: ai.promptctl.low-talker.dev
      serviceKey: "!"
      launchdLabel: ai.promptctl.low-talker.keyboardd.dev
      inputMethodTarget: LowTalkerDevInputMethod

  # The input method each app above carries, one bundle per installation.
  LowTalkerInputMethod:
    templates: [InputMethod]
    templateAttributes:
      displayName: LowTalker
      inputMethodBundleIdentifier: ai.promptctl.low-talker.inputmethod.dictation
      inputSourceIdentifier: ai.promptctl.low-talker.inputmethod.dictation.text
      inputMethodConnectionName: ai.promptctl.low-talker.inputmethod.dictation_Connection

  LowTalkerDevInputMethod:
    templates: [InputMethod]
    templateAttributes:
      displayName: LowTalker Dev
      inputMethodBundleIdentifier: ai.promptctl.low-talker.dev.inputmethod.dictation
      inputSourceIdentifier: ai.promptctl.low-talker.dev.inputmethod.dictation.text
      inputMethodConnectionName: ai.promptctl.low-talker.dev.inputmethod.dictation_Connection

  # The root keyboard helper, built here from the same sources Package.swift builds it
  # from, because an Xcode app can embed an Xcode tool and cannot embed a package's
  # executable. `make helper` builds the same program for the LaunchDaemon path.
  lowtalker-keyboardd:
    type: tool
    platform: macOS
    sources:
      - Sources/lowtalker-keyboardd
    dependencies:
      - package: low-talker
        product: KeyboardService
      - package: low-talker
        product: VirtualKeyboard
      - package: low-talker
        product: Keystrokes
      - package: low-talker
        product: Signals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.promptctl.low-talker.keyboardd
        # Xcode signs a tool under its product name and ignores the identifier above, so it
        # is passed to codesign by hand; the copy into each bundle keeps it. `make helper`
        # reads the same setting, so both builds of the helper are one code identity. Inherited,
        # so a Release build keeps the project's --timestamp, which notarization requires.
        OTHER_CODE_SIGN_FLAGS: $(inherited) --identifier $(PRODUCT_BUNDLE_IDENTIFIER)
