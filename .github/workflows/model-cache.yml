# Keeps the model a release carries in the Actions cache, saved from master: a run for a tag
# can restore a cache saved on the default branch, but never one saved for another tag. So
# release.yml only restores, and this saves, under the name of the model master's CLI names
# as its default and the Hugging Face commits a fetch of it brings, once per pair.
name: Model cache

on:
  push:
    branches: [master]

permissions:
  contents: read
  # To check the save landed.
  actions: read

# A run partway through its download or save finishes. A later push waits, replacing any
# push already waiting, whose default is almost always the same.
concurrency:
  group: model-cache
  cancel-in-progress: false

jobs:
  cache:
    name: Cache the default model
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # SHA-pinned, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create an unlocked default keychain
        run: scripts/runner-keychain model-cache

      - name: Create the dev signing identity
        run: make signing-identity

      # [LAW:one-source-of-truth] The same questions release.yml asks: the default is the
      # source's, and the commits a fetch of it brings are the hub's, asked through the CLI.
      - name: Name the default model
        id: model
        run: |
          set -euo pipefail
          cli=$(make cli | tail -n 1)
          model=$("$cli" model default)
          revision=$("$cli" model revision --model "$model")
          {
            echo "cli=$cli"
            echo "revision=$revision"
            echo "key=model-store-$model-$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Look the model up
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/model-store
          key: ${{ steps.model.outputs.key }}
          lookup-only: true

      # A cache entry is never overwritten, so a saved key is left as it is. A fetch that
      # brought other commits than the key names, because upstream moved in between, fails
      # rather than saving them under it.
      - name: Fetch the model
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          CLI: ${{ steps.model.outputs.cli }}
          REVISION: ${{ steps.model.outputs.revision }}
        run: '"$CLI" model download --models-dir "$RUNNER_TEMP/model-store" --revision "$REVISION"'

      - name: Save the model
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/model-store
          key: ${{ steps.model.outputs.key }}

      # actions/cache/save only warns when it cannot reserve or upload, so the entry is looked
      # for rather than assumed.
      - name: Check master's cache holds the model
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.model.outputs.key }}
          CACHED: ${{ steps.lookup.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $ENV is jq's, not the shell's
          n=$(gh cache list --ref refs/heads/master --key "$KEY" --json key --jq 'map(select(.key == $ENV.KEY)) | length')
          [ "$n" = 1 ] || { echo "master's cache holds no $KEY" >&2; exit 1; }
          echo "Model cache: \`$KEY\` (already cached: ${CACHED:-false})" >> "$GITHUB_STEP_SUMMARY"
