# Keeps the model a release carries in the Actions cache, saved from master: a run for a tag
# can restore a cache saved on the default branch, but never one saved for another tag. So
# release.yml only restores, and this saves, under the name of the model master's CLI names
# as its default, once per name.
name: Model cache

on:
  push:
    branches: [master]

permissions:
  contents: read

# A run partway through its download or save finishes; a later push queues behind it.
concurrency:
  group: model-cache
  cancel-in-progress: false

jobs:
  cache:
    name: Cache the default model
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # SHA-pinned, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create an unlocked default keychain
        run: scripts/runner-keychain model-cache

      - name: Create the dev signing identity
        run: make signing-identity

      # [LAW:one-source-of-truth] The same question release.yml asks: the default is the source's.
      - name: Name the default model
        id: model
        run: |
          set -euo pipefail
          cli=$(make cli | tail -n 1)
          model=$("$cli" model default)
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "default=$model" >> "$GITHUB_OUTPUT"

      - name: Look the model up
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/model-store
          key: model-store-${{ steps.model.outputs.default }}
          lookup-only: true

      # A cache entry is never overwritten, so a saved name is left as it is.
      - name: Fetch the model
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          CLI: ${{ steps.model.outputs.cli }}
        run: '"$CLI" model download --models-dir "$RUNNER_TEMP/model-store"'

      - name: Save the model
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/model-store
          key: model-store-${{ steps.model.outputs.default }}

      - name: Report
        env:
          MODEL: ${{ steps.model.outputs.default }}
          CACHED: ${{ steps.lookup.outputs.cache-hit }}
        run: 'echo "Model: \`$MODEL\` (already cached: ${CACHED:-false})" >> "$GITHUB_STEP_SUMMARY"'
