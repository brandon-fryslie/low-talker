# Builds and tests every pull request to master, and master itself after a merge,
# so the merge rule has a check to gate on.
#
# [LAW:one-source-of-truth] The build recipe lives in the Makefile. This file only
# provisions a runner and calls the same targets a developer runs; if a step here
# ever spells out swift or xcodebuild directly, it has grown a second recipe.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a PR supersedes the run for the SHA it replaced.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # macos-15 ships Xcode 16.4 as its default, which carries the Swift 6 toolchain
    # Package.swift asks for; jq is preinstalled, xcodegen is not.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # SHA-pinned, same pin and same reasoning as code-review.yml: third-party code
      # fetched on every run, including fork PRs, so a moving tag is not acceptable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create an unlocked default keychain
        run: scripts/runner-keychain ci

      - name: Create the dev signing identity
        run: make signing-identity

      # Proves the identity this job just created can actually sign, before the longer
      # steps spend time on a keychain that cannot. `make test` runs the same recipe again
      # at its end, because `swift test` ad-hoc signs whatever it links; `make app` signs
      # through Xcode.
      - name: Sign the CLI
        run: make cli

      - name: Build and test the package
        run: make test

      # Both installations, because they are two Xcode targets built from one template
      # and only building one proves only that one's attributes resolve. A release target
      # left naming the development plist would pass a job that built `make app` alone.
      # The runner has no model to carry, so the bundles are built carrying none, which is
      # a build every Makefile path allows and one the app names at launch. Signing reaches
      # Apple's timestamp server, as every build's does (project.yml); a runner that cannot
      # fails here with "The timestamp service is not available".
      - name: Build both installations
        run: make app release BUNDLED_MODEL_STORE=
