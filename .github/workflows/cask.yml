# Moves the low-talker cask in promptctl/homebrew-tap to this repository's newest release.
# The tap calls this from its own .github/workflows/low-talker.yaml, so the write to the tap
# is the tap's own token: the promptctl org admits no deploy keys. release.yml starts that
# workflow once a release is published and fails when the cask is not at that release
# afterward.
#
# A caller gives the job contents: write on itself, the tap; this repository is public and
# only read.
name: cask

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  cask:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scripts of the commit this workflow is, whatever ref the tap calls it at.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: low-talker

      # [LAW:one-source-of-truth] The newest release is the latest one published, not a
      # draft, read off the Releases each run: the cask holds no other record of it. Every
      # release so far is a pre-release, so unlike a stable-only tap this takes those too.
      # update-cask reads the sha256 GitHub recorded for the package, so nothing is downloaded,
      # and it leaves a cask already at that release unchanged, so a run that finds nothing
      # to move pushes nothing.
      - name: The cask is low-talker's newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo promptctl/low-talker --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // error("promptctl/low-talker has published no release")')
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          low-talker/scripts/update-cask tap "${tag#v}" | tee -a "$GITHUB_STEP_SUMMARY"
          if git -C tap diff --quiet -- Casks/low-talker.rb; then
            echo "the cask is already at ${tag#v}"
          else
            git -C tap commit --quiet -m "low-talker ${tag#v}" -- Casks/low-talker.rb
            git -C tap push origin HEAD
          fi
